# TLS only, passwords required, per-user topic ACL. Add a cleartext listener
# (listener 1883) only on a trusted network, for devices that cannot do TLS.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /etc/ming/certs/ca.crt
certfile /etc/ming/certs/server.crt
keyfile /etc/ming/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest stdout
