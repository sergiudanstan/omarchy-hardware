# Slack app manifest for the omarchy-hardware bridge.
# api.slack.com/apps -> Create New App -> From a manifest -> paste this.
# Socket Mode: the bridge connects out to Slack; no public URL or open port.
display_information:
  name: Omarchy Hardware
  description: Answers questions about the boards on an Omarchy workstation, read-only.
  background_color: "#1f2328"
features:
  bot_user:
    display_name: omarchy-hardware
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # receive @mentions
      - chat:write          # reply in the thread
      - reactions:write     # add 👀 while working (optional)
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
