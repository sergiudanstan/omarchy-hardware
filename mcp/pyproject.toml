[project]
name = "omarchy-hardware"
version = "0.1.4"
description = "MCP server exposing Arduino/ESP32/Pico serial boards and Raspberry Pi GPIO to Claude"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sergiu-Dan Stan" }]
dependencies = [
    "mcp>=2.0",
    "pyserial>=3.5",
    # Weintek OPC UA. LGPL-3.0-or-later, used unmodified as a library.
    "asyncua>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
omarchy-hardware-mcp = "omarchy_hardware.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omarchy_hardware*"]

[tool.setuptools.package-data]
omarchy_hardware = [
    "profiles/*.toml",
    "templates/*.md",
    "templates/claude/commands/*.md",
    "templates/claude/skills/*/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# S is flake8-bandit: subprocess handling, weak hashes, hardcoded secrets --
# the actual risk surface of gpio_ssh.py and flash.py.
select = ["E", "F", "B", "S", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; the credentials in tests are fixtures for fake servers.
"tests/*" = ["S101", "S105", "S106"]
