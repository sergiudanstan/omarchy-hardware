# Arduino Mega 2560 R3. Pin numbers are Arduino pin numbers (A0 is 54).
id = "arduino_mega_2560"
name = "Arduino Mega 2560 R3"
family = "microcontroller"
mcu = "ATmega2560, 16 MHz"
fqbns = ["arduino:avr:mega"]
logic_voltage = 5.0
five_volt_tolerant = "all"
led_builtin = "D13"
flash_methods = ["arduino-cli (avrdude through the USB serial bootloader)"]
sources = [
  "https://docs.arduino.cc/hardware/mega-2560/",
  "https://ww1.microchip.com/downloads/en/devicedoc/atmel-2549-8-bit-avr-microcontroller-atmega640-1280-1281-2560-2561_datasheet.pdf",
]
notes = [
  "Four hardware serial ports: Serial on D0/D1 (USB), Serial1 on D19/D18, Serial2 on D17/D16, Serial3 on D15/D14.",
  "I2C is on D20 (SDA) and D21 (SCL), not on A4/A5 as on the Uno.",
  "SPI is on D50-D53, and also on the 6-pin ICSP header.",
  "The ADC is 10-bit (0-1023) against AREF, which is 5 V by default.",
  "The Servo library takes Timer5 first (ServoTimers.h), which drives PWM on D44-D46; avoid analogWrite() there while servos are attached.",
]

[current_ma]
per_pin_recommended = 20
per_pin_absolute_max = 40
note = "Keep the sum of all pin currents well under 200 mA; the datasheet sets lower limits per port group. Drive motors, relays and servos through a driver."

[[power]]
name = "5V"
note = "From USB (behind a 500 mA resettable fuse) or from the onboard regulator when powered through VIN or the barrel jack."

[[power]]
name = "3.3V"
note = "Onboard regulator output, 50 mA maximum."

[[power]]
name = "VIN"
note = "Unregulated input, 7-12 V recommended."

[[power]]
name = "AREF"
note = "Analog reference input. Do not apply a voltage here unless analogReference(EXTERNAL) is set first."

[[pins]]
name = "D0"
gpio = 0
caps = ["digital", "uart_rx"]
caution = "USB serial RX (Serial). Anything connected here interferes with Serial and with uploads."

