# Raspberry Pi Pico W. Pin numbers are RP2040 GPIO numbers (GPn), not header positions.
id = "raspberry_pi_pico_w"
name = "Raspberry Pi Pico W"
family = "microcontroller"
mcu = "RP2040 (dual-core Arm Cortex-M0+, 133 MHz), CYW43439 WiFi and Bluetooth"
fqbns = ["rp2040:rp2040:rpipicow"]
logic_voltage = 3.3
five_volt_tolerant = "none"
led_builtin = "LED_BUILTIN (on the wireless chip, WL_GPIO0; not an RP2040 pin)"
flash_methods = [
  "arduino-cli with the arduino-pico core (resets into the UF2 bootloader over USB)",
  "UF2 copy to the RPI-RP2 drive after holding BOOTSEL while plugging in",
]
sources = [
  "https://datasheets.raspberrypi.com/picow/pico-w-datasheet.pdf",
  "https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf",
  "https://arduino-pico.readthedocs.io/en/latest/pins.html",
]
notes = [
  "Not 5 V tolerant. Use a level shifter or a divider for 5 V signals.",
  "Every GPIO can do PWM and raise an interrupt. Two GPIOs on the same PWM slice and channel share a duty cycle.",
  "I2C, SPI and UART can move to other pins (Wire.setSDA(), SPI.setRX(), Serial1.setTX() and so on). The pins listed are the arduino-pico defaults.",
  "The ADC is 12-bit, 0-3.3 V against ADC_VREF. Only GP26, GP27 and GP28 are analog inputs on the header.",
  "Serial is USB CDC; Serial1 and Serial2 are the hardware UARTs.",
]

[current_ma]
per_pin_recommended = 4
per_pin_absolute_max = 12
total_max = 50
note = "4 mA is the default drive strength and 12 mA the highest it can be set to. Drive motors, relays and servos through a driver."

[[power]]
name = "VBUS"
note = "USB 5 V, present only when USB is connected."

[[power]]
name = "VSYS"
note = "Main system input, 1.8-5.5 V. Feeds the onboard buck-boost converter."

[[power]]
name = "3V3(OUT)"
note = "Buck-boost output. Keep external loads under 300 mA."

[[power]]
name = "3V3_EN"
note = "Pulled up; pull it low to switch off the 3.3 V supply and the board."

[[power]]
name = "RUN"
note = "RP2040 reset. Pull low to reset."

[[power]]
name = "ADC_VREF"
note = "ADC reference, filtered 3.3 V by default."

[[pins]]
name = "GP0"
gpio = 0
caps = ["digital", "pwm", "interrupt", "uart_tx"]
note = "Serial1 TX by default."

[[pins]]
name = "GP1"
gpio = 1
caps = ["digital", "pwm", "interrupt", "uart_rx"]
note = "Serial1 RX by default."

