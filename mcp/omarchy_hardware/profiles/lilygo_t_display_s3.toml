# LilyGO T-Display-S3, ESP32-S3R8 with 16 MB flash and 8 MB OPI PSRAM.
id = "lilygo_t_display_s3"
name = "LilyGO T-Display-S3"
family = "microcontroller"
mcu = "ESP32-S3 (dual-core Xtensa LX7, 240 MHz), WiFi and Bluetooth LE"
fqbns = ["esp32:esp32:lilygo_t_display_s3"]
logic_voltage = 3.3
five_volt_tolerant = "none"
flash_methods = ["arduino-cli (USB CDC through the ESP32-S3 native USB interface)"]
sources = [
  "https://github.com/espressif/arduino-esp32/blob/3.3.12/boards.txt",
  "https://github.com/espressif/arduino-esp32/blob/3.3.12/variants/lilygo_t_display_s3/pins_arduino.h",
  "https://github.com/Xinyuan-LilyGO/T-Display-S3/blob/main/README.md",
  "https://github.com/Xinyuan-LilyGO/T-Display-S3/blob/main/examples/Arduino_GFXDemo/Arduino_GFXDemo.ino",
  "https://github.com/Xinyuan-LilyGO/T-Display-S3/blob/main/examples/factory/factory.ino",
  "https://www.espressif.com/sites/default/files/documentation/esp32-s3_datasheet_en.pdf",
]
notes = [
  "The board definition selects ESP32-S3, 16 MB flash and OPI PSRAM; the manufacturer lists product revisions including a touch variant.",
  "Not 5 V tolerant. Use a level shifter or a divider for 5 V signals.",
  "GPIO15 must be driven HIGH to power the LCD and other peripherals.",
  "Only GPIOs listed by the core variant or used by documented onboard peripherals are included; do not infer other connector pins from this profile.",
  "ADC1 channels are GPIO1-10 (ADC1_CH0-CH9). ADC2 channels are GPIO11-20 (ADC2_CH0-CH9). Prefer ADC1 when WiFi is used.",
  "GPIO19 and GPIO20 are native USB D- and D+; do not use them as general I/O while USB is in use.",
  "GPIO26-32 are internal memory connections. GPIO33-37 are reserved for this board's octal PSRAM.",
]

[identity]
vendor = "LilyGO"
usb = [{ vid = "303a", pid = "1001" }]
usb_unique = false
chip = "ESP32-S3"
module = "ESP32-S3R8"
flash_mb = [16]
psram_mb = [8]

[build]
fqbn = "esp32:esp32:lilygo_t_display_s3"

[validation]
status = "documented"

[current_ma]
per_pin_recommended = 20
per_pin_absolute_max = 28
note = "Conservative wiring-check policy: 20 mA recommended ceiling, 28 mA hard ceiling (the lower of the datasheet DC source/sink characteristics, 40/28 mA at maximum drive). These are policy limits, not a manufacturer per-pin absolute-maximum rating."

[[peripherals]]
kind = "display"
name = "1.9 inch IPS LCD"
controller = "ST7789"
interface = "parallel8"
width = 170
height = 320
color = "rgb565"
pins = { d0 = 39, d1 = 40, d2 = 41, d3 = 42, d4 = 45, d5 = 46, d6 = 47, d7 = 48, wr = 8, rd = 9, cs = 6, dc = 7, rst = 5, backlight = 38 }
backlight_active = "high"
note = "Manufacturer Arduino_GFX example drives the backlight HIGH and lists the 8-bit parallel wiring."

[[peripherals]]
kind = "button"
name = "BOOT button"
pins = { input = 0 }
active = "low"
pull = "internal_up"
note = "The board pinout identifies GPIO0 as the BOOT button."

[[peripherals]]
kind = "button"
name = "Button 2"
pins = { input = 14 }
active = "low"
pull = "internal_up"
note = "The manufacturer pinout assigns GPIO14 to Button 2."

[[peripherals]]
kind = "battery"
name = "Battery voltage input"
pins = { sense = 4 }
note = "The manufacturer pinout assigns GPIO4 to battery voltage measurement; divider ratio is not stated."

# --- Board connector and peripheral GPIOs ---
[[pins]]
name = "GPIO0"
gpio = 0
caps = ["digital", "pwm", "interrupt"]
caution = "Strapping pin and BOOT button (active low); do not hold low at power-up."

[[pins]]
name = "GPIO1"
gpio = 1
caps = ["digital", "pwm", "interrupt", "analog_in", "touch"]
adc = "ADC1_CH0"
note = "P2 connector."

[[pins]]
name = "GPIO2"
gpio = 2
caps = ["digital", "pwm", "interrupt", "analog_in", "touch"]
adc = "ADC1_CH1"
note = "P2 connector."

