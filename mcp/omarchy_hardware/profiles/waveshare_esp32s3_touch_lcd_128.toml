gpio = 43
caps = ["digital", "pwm", "interrupt", "uart_tx"]
caution = "UART0 TX (U0TXD, the variant's TX), wired to the CH343P bridge's RXD. Repurposing it breaks USB serial output, log monitoring and uploads."

[[pins]]
name = "GPIO44"
gpio = 44
caps = ["digital", "pwm", "interrupt", "uart_rx"]
caution = "UART0 RX (U0RXD, the variant's RX), wired from the CH343P bridge's TXD. Repurposing it breaks USB serial input and uploads."

# --- GPIO45-46: strapping pins ---
[[pins]]
name = "GPIO45"
gpio = 45
caps = ["digital", "pwm", "interrupt"]
caution = "Strapping pin (VDD_SPI voltage). Selects VDD_SPI voltage unless overridden by eFuses. Do not change its reset level without checking the chip configuration."

[[pins]]
name = "GPIO46"
gpio = 46
caps = ["digital", "pwm", "interrupt"]
caution = "Strapping pin for boot mode and ROM message printing. Keep low for joint download boot with GPIO0 low; check the datasheet before adding pull resistors."

