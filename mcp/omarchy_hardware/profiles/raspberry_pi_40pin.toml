# Raspberry Pi 40-pin GPIO header (Pi 3, 4 and 5). gpio is the BCM number that
# gpio_read_pin and gpio_write_pin take; physical is the position on the header.
id = "raspberry_pi_40pin"
name = "Raspberry Pi 40-pin GPIO header (Pi 3, 4, 5)"
family = "raspberry_pi"
mcu = "BCM2837 (Pi 3), BCM2711 (Pi 4), or BCM2712 with RP1 I/O (Pi 5)"
fqbns = []
logic_voltage = 3.3
five_volt_tolerant = "none"
flash_methods = []
sources = [
  "https://www.raspberrypi.com/documentation/computers/raspberry-pi.html#gpio",
  "https://pinout.xyz/",
]
notes = [
  "Not 5 V tolerant. 5 V on any GPIO can permanently damage the Pi.",
  "The 5V pins connect straight to the supply. Shorting one to a GPIO or 3V3 pin is destructive.",
  "Tools address pins by BCM number (gpio), not by header position (physical). Only pins listed in [pi] pins in config.toml can be driven.",
  "Hardware PWM is on GPIO12 and GPIO18 (channel 0) and GPIO13 and GPIO19 (channel 1). The Pi 5 routes it through RP1, with the same pins.",
  "I2C, SPI and UART must be enabled with raspi-config before those pins switch to their bus functions.",
]

[current_ma]
per_pin_recommended = 8
per_pin_absolute_max = 16
note = "8 mA is the default drive strength and 16 mA the highest it can be set to. Keep the total across all pins low and switch loads through a transistor or driver."

[[pins]]
name = "3V3"
physical = 1
caps = ["power"]

[[pins]]
name = "5V"
physical = 2
caps = ["power"]

[[pins]]
name = "GPIO2"
physical = 3
gpio = 2
caps = ["digital", "i2c_sda"]
caution = "I2C1 SDA. Has a fixed 1.8 kOhm pull-up to 3.3 V, so it reads high when nothing drives it."

[[pins]]
name = "5V"
physical = 4
caps = ["power"]

[[pins]]
name = "GPIO3"
physical = 5
gpio = 3
caps = ["digital", "i2c_scl"]
caution = "I2C1 SCL. Has a fixed 1.8 kOhm pull-up to 3.3 V, so it reads high when nothing drives it."

