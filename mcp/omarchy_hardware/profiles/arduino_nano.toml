# Arduino Nano (ATmega328P). Pin numbers are Arduino pin numbers (A0 is 14).
id = "arduino_nano"
name = "Arduino Nano"
family = "microcontroller"
mcu = "ATmega328P, 16 MHz"
fqbns = ["arduino:avr:nano"]
logic_voltage = 5.0
five_volt_tolerant = "all"
led_builtin = "D13"
flash_methods = ["arduino-cli (avrdude through the USB serial bootloader)"]
sources = [
  "https://docs.arduino.cc/hardware/nano/",
  "https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-7810-Automotive-Microcontrollers-ATmega328P_Datasheet.pdf",
]
notes = [
  "Most clones use a CH340 USB chip and the old bootloader: compile and upload with arduino:avr:nano:cpu=atmega328old.",
  "A CH340 or CP210x clone is not identified from USB alone; pass the FQBN explicitly.",
  "The ADC is 10-bit (0-1023) against AREF, which is 5 V by default.",
  "PWM on D5 and D6 runs at about 980 Hz (Timer0); D3, D9, D10 and D11 at about 490 Hz.",
  "The Servo library takes Timer1, which disables analogWrite() on D9 and D10.",
  "tone() takes Timer2, which interferes with PWM on D3 and D11.",
  "A6 and A7 are analog inputs only: digitalRead() and pinMode() do not work on them.",
]

[current_ma]
per_pin_recommended = 20
per_pin_absolute_max = 40
total_max = 200
note = "Drive motors, relays, solenoids and servos through a driver or transistor, never straight from a pin."

[[power]]
name = "5V"
note = "From USB, or from the onboard regulator when powered through VIN."

[[power]]
name = "3V3"
note = "Small current only. On the original Nano it comes from the USB chip; clones differ. Do not power radios or displays from it."

[[power]]
name = "VIN"
note = "Unregulated input, 7-12 V recommended."

[[power]]
name = "AREF"
note = "Analog reference input. Do not apply a voltage here unless analogReference(EXTERNAL) is set first."

[[pins]]
name = "D0"
gpio = 0
caps = ["digital", "uart_rx"]
caution = "USB serial RX. Anything connected here interferes with Serial and with uploads."

[[pins]]
name = "D1"
gpio = 1
caps = ["digital", "uart_tx"]
caution = "USB serial TX. Anything connected here interferes with Serial and with uploads."

[[pins]]
name = "D2"
gpio = 2
caps = ["digital", "interrupt"]

[[pins]]
name = "D3"
gpio = 3
caps = ["digital", "pwm", "interrupt"]

[[pins]]
name = "D4"
gpio = 4
caps = ["digital"]

[[pins]]
name = "D5"
gpio = 5
caps = ["digital", "pwm"]

[[pins]]
name = "D6"
gpio = 6
caps = ["digital", "pwm"]

[[pins]]
name = "D7"
gpio = 7
caps = ["digital"]

[[pins]]
name = "D8"
gpio = 8
caps = ["digital"]

[[pins]]
name = "D9"
gpio = 9
caps = ["digital", "pwm"]

[[pins]]
name = "D10"
gpio = 10
caps = ["digital", "pwm", "spi_cs"]
note = "Must stay an output while the board is an SPI controller, even if another pin selects the device."

[[pins]]
name = "D11"
gpio = 11
caps = ["digital", "pwm", "spi_mosi"]

[[pins]]
name = "D12"
gpio = 12
caps = ["digital", "spi_miso"]

[[pins]]
name = "D13"
gpio = 13
caps = ["digital", "spi_sck", "led"]
note = "Onboard LED."

[[pins]]
name = "A0"
gpio = 14
caps = ["digital", "analog_in"]

[[pins]]
name = "A1"
gpio = 15
caps = ["digital", "analog_in"]

[[pins]]
name = "A2"
gpio = 16
caps = ["digital", "analog_in"]

[[pins]]
name = "A3"
gpio = 17
caps = ["digital", "analog_in"]

[[pins]]
name = "A4"
gpio = 18
caps = ["digital", "analog_in", "i2c_sda"]

[[pins]]
name = "A5"
gpio = 19
caps = ["digital", "analog_in", "i2c_scl"]

[[pins]]
name = "A6"
caps = ["analog_in"]
note = "Analog input only."

[[pins]]
name = "A7"
caps = ["analog_in"]
note = "Analog input only."
