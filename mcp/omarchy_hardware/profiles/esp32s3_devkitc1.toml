gpio = 45
note = "J3 pin 15."
caps = ["digital", "pwm", "interrupt"]
caution = "Strapping pin (VDD_SPI voltage). Selects VDD_SPI voltage unless overridden by eFuses. Do not change its reset level without checking the module voltage and eFuse configuration."

[[pins]]
name = "GPIO46"
gpio = 46
note = "J1 pin 14."
caps = ["digital", "pwm", "interrupt"]
caution = "Strapping pin for boot mode and ROM message printing. Keep low for joint download boot with GPIO0 low; check the datasheet before adding pull resistors."

