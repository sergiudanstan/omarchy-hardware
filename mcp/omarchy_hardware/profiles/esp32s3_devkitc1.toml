# Espressif ESP32-S3-DevKitC-1 (module and board revisions vary). Pin numbers are GPIO numbers.
id = "esp32s3_devkitc1"
name = "ESP32-S3-DevKitC-1"
family = "microcontroller"
mcu = "ESP32-S3 (dual-core Xtensa LX7, 240 MHz), WiFi and Bluetooth LE"
fqbns = ["esp32:esp32:esp32s3"]
logic_voltage = 3.3
five_volt_tolerant = "none"
flash_methods = ["arduino-cli (USB CDC or UART through the USB-to-UART bridge)"]
sources = [
  "https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s3/esp32-s3-devkitc-1/user_guide_v1.1.html",
  "https://github.com/espressif/arduino-esp32/blob/3.3.12/variants/esp32s3/pins_arduino.h",
  "https://www.espressif.com/sites/default/files/documentation/esp32-s3_datasheet_en.pdf",
  "https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/gpio.html",
]
notes = [
  "Not 5 V tolerant. Use a level shifter or a divider for 5 V signals.",
  "ADC1 channels are GPIO1-10 (ADC1_CH0-CH9). ADC2 channels are GPIO11-20 (ADC2_CH0-CH9). Prefer ADC1 when WiFi is used; ADC2 shares resources with WiFi.",
  "The ADC is 12-bit; use ADC1 for analog input in WiFi projects.",
  "GPIO19 and GPIO20 are the USB D- and D+ pins for the native USB (USB_SERIAL_JTAG / TinyUSB). Do not use them as general I/O when USB is in use.",
  "GPIO26-32 are reserved for flash/PSRAM. GPIO33-37 must also remain reserved on octal flash/PSRAM modules. GPIO26-34 are not header pins; their entries document internal memory connections, not accessible wiring points.",
  "The onboard addressable RGB LED is on GPIO48 on DevKitC-1 v1.0 and on GPIO38 on v1.1. Check your board revision.",
  "I2C (Wire) defaults to GPIO8 (SDA) and GPIO9 (SCL). SPI defaults to GPIO11 (MOSI), GPIO13 (MISO), GPIO12 (SCK), GPIO10 (SS).",
  "Every output-capable GPIO can do PWM (LEDC) and every GPIO can raise an interrupt.",
]

[identity]
vendor = "Espressif"
usb = [{ vid = "303a", pid = "1001" }]
usb_unique = false
chip = "ESP32-S3"

[validation]
status = "documented"

[current_ma]
per_pin_recommended = 20
per_pin_absolute_max = 28
note = "Conservative wiring-check policy: 20 mA recommended ceiling, 28 mA hard ceiling (the lower of the datasheet DC source/sink characteristics, 40/28 mA at maximum drive). These are policy limits, not a manufacturer per-pin absolute-maximum rating; that rating is not specified. Use external drivers for loads."

[[power]]
name = "3V3"
note = "Onboard LDO output, shared with the module. Budget for the WiFi transmit peaks before adding loads."

[[power]]
name = "5V"
note = "USB 5 V when powered from USB."

# --- GPIO0: strapping pin (boot mode) ---
[[pins]]
name = "GPIO0"
gpio = 0
note = "J3 pin 14."
caps = ["digital", "pwm", "interrupt"]
caution = "Strapping pin, sampled at reset. High = normal boot, low = download mode (the BOOT button pulls it low). Do not connect anything that holds it low at power-up."

# --- GPIO1-10: ADC1_CH0-CH9, touch T1-T10 ---
[[pins]]
name = "GPIO1"
gpio = 1
note = "J3 pin 4."
caps = ["digital", "pwm", "interrupt", "analog_in", "touch"]
adc = "ADC1_CH0"

[[pins]]
name = "GPIO2"
gpio = 2
note = "J3 pin 5."
caps = ["digital", "pwm", "interrupt", "analog_in", "touch"]
adc = "ADC1_CH1"

[[pins]]
name = "GPIO3"
gpio = 3
note = "J1 pin 13."
caps = ["digital", "pwm", "interrupt", "analog_in", "touch"]
adc = "ADC1_CH2"
caution = "Strapping pin (JTAG signal source). Sampled at reset; check the JTAG source configuration before adding pull resistors."

[[pins]]
name = "GPIO4"
gpio = 4
note = "J1 pin 4."
caps = ["digital", "pwm", "interrupt", "analog_in", "touch"]
adc = "ADC1_CH3"

[[pins]]
