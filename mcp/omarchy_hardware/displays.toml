# Controller facts are from the cited datasheets. Library classes were checked
# against the library source; breakout-board voltages and wiring can differ.

[[display]]
controller = "SSD1306"
kind = "oled"
interfaces = ["i2c", "spi", "parallel8"]
logic_voltage = 3.3
resolutions = ["128x64", "128x32"]
color = "mono"
i2c_addresses = ["0x3c", "0x3d"]
roles = { i2c = ["i2c_sda", "i2c_scl"], spi = ["spi_mosi", "spi_sck", "spi_cs", "display_dc", "display_rst"], parallel8 = ["digital_out", "display_dc", "display_rst"] }
libraries = [{ name = "GFX Library for Arduino", classes = ["Arduino_SSD1306"] }]
notes = ["Breakout boards differ: check whether yours has a regulator and level shifters.", "Some modules expose only a subset of controller interfaces.", "Parallel8 wiring uses eight digital outputs plus the listed control lines."]
sources = ["https://cdn-shop.adafruit.com/datasheets/SSD1306.pdf", "https://github.com/moononournation/Arduino_GFX"]

