[[display]]
controller = "HD44780"
kind = "character_lcd"
interfaces = ["i2c"]
logic_voltage = 5.0
resolutions = ["16x2", "20x4"]
color = "character"
i2c_addresses = ["0x20", "0x21", "0x22", "0x23", "0x24", "0x25", "0x26", "0x27", "0x38", "0x39", "0x3a", "0x3b", "0x3c", "0x3d", "0x3e", "0x3f"]
roles = { i2c = ["i2c_sda", "i2c_scl"] }
libraries = [{ name = "hd44780", classes = ["hd44780_I2Cexp"] }]
notes = ["Backpacks may use PCF8574 addresses 0x20-0x27 or PCF8574A addresses 0x38-0x3f.", "Many backpacks are powered at 5 V; check the pull-up voltage and use level shifting with 3.3 V boards."]
sources = ["https://www.sparkfun.com/datasheets/LCD/HD44780.pdf", "https://www.ti.com/lit/ds/symlink/pcf8574.pdf", "https://github.com/duinoWitchery/hd44780"]
