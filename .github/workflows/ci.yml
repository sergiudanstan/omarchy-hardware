name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          # Development happens on 3.14, so cover it -- but do not gate merges on
          # it until the dependencies formally support it.
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config, where it can be
          # picked up by anything that later archives the workspace.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r mcp/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./mcp
          python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Run test suite
        run: python -m pytest mcp/tests -q

  native:
    name: native core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run hardware_core_test
        run: |
          gcc -Wall -Wextra -Wpedantic -Werror -std=c11 \
            -I native/include \
            -o /tmp/hardware_core_test \
            native/src/hardware_core.c native/tests/hardware_core_test.c
          /tmp/hardware_core_test

  dotnet:
    name: dotnet contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Build the hardware adapter contracts
        # These ship inside the plugin and were never compiled in CI, so a
        # contract could break without anything noticing. Warnings are not errors
        # yet: this project has never been built here, and turning them up before
        # a first green run would gate merges on a baseline nobody has seen.
        run: dotnet build dotnet/Omarchy.Hardware/Omarchy.Hardware.csproj

  shell:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config, where it can be
          # picked up by anything that later archives the workspace.
          persist-credentials: false
      - name: shellcheck
        # hardware-mcp has no .sh suffix, so name every file explicitly.
        run: shellcheck --severity=style bin/setup.sh bin/doctor.sh bin/scan-boards.sh bin/panel-status.sh bin/board-arrived.sh bin/start-project.sh bin/hardware-mcp
      - name: bash syntax
        run: for f in bin/setup.sh bin/doctor.sh bin/scan-boards.sh bin/panel-status.sh bin/board-arrived.sh bin/start-project.sh bin/hardware-mcp; do bash -n "$f"; done

  plugin:
    name: plugin manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config, where it can be
          # picked up by anything that later archives the workspace.
          persist-credentials: false
      - name: Validate manifest.json against the Omarchy schema rules
        run: python3 .github/scripts/check_manifest.py
      - name: Check versions agree across manifest, pyproject and package
        run: python3 .github/scripts/check_versions.py
      - name: Syntax-check the widget's JavaScript
        # BoardsModel.js is QML-flavoured JS: `.pragma library` is not valid plain
        # JavaScript, so strip pragmas before handing it to node.
        run: |
          sed '/^\s*\.pragma/d' BoardsModel.js > /tmp/BoardsModel.check.js
          node --check /tmp/BoardsModel.check.js
      - name: Test widget catalog and visibility
        run: node --test tests/widget.test.cjs
      - name: Reject symlinks (the Omarchy plugin validator rejects them outright)
        run: |
          found=$(find . -name .git -prune -o -type l -print)
          if [ -n "$found" ]; then echo "symlinks found:"; echo "$found"; exit 1; fi

  claims:
    name: documented claims
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r mcp/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./mcp
          python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Verify the threat model's countable claims
        run: python3 .github/scripts/check_claims.py

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config, where it can be
          # picked up by anything that later archives the workspace.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install audit tooling
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in dependencies
        # Audit the lockfile rather than an installed environment: the lock is the
        # exact set of versions users actually receive, and it avoids this project's
        # own package (absent from PyPI) being treated as unauditable. --no-deps is
        # correct here because the lock already contains every transitive pin.
        run: pip-audit --strict --no-deps -r mcp/requirements.lock --progress-spinner off
      - name: Known vulnerabilities in the CI toolchain
        # The tools that decide whether a release is fit to publish are part of
        # the supply chain too, even though users never install them.
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - name: Lint and security rules
        # S is the flake8-bandit ruleset: subprocess use, hardcoded secrets,
        # insecure hashes -- the real risk surface in gpio_ssh.py and flash.py.
        run: ruff check --output-format=github mcp/omarchy_hardware mcp/tests
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
